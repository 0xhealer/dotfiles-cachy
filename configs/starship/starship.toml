# Explicit format - robbyrussell-simple two-row layout, matching this
# file's own "FIRST LINE/ROW" / "SECOND LINE/ROW" section comments below.
# Without this, starship falls back to its large built-in default order,
# which is what put the OS logo on row 2 - dropped here as requested,
# everything else you'd already configured is kept.
format = """
$username$hostname$directory$git_metrics$sudo$git_status$git_branch$nix_shell$golang$python$rust$nodejs$lua$java$kotlin$scala$swift$php$ruby$perl$haskell$julia$zig$gradle$package$memory_usage$cmd_duration
$battery$status$character"""

