## FIRST LINE/ROW: Info & Status
[username]
format = "[힐러](bold mauve) @ "
show_always = true
style_root = "bold red"

[hostname]
disabled = false
format = "[판도라](bold maroon) in "
ssh_only = false
ssh_symbol = "󰢹 "

[directory]
style = "bold peach"
truncate_to_repo = true
truncation_length = 0
truncation_symbol = "레포: "
read_only = "󰌾 "

[git_metrics]
disabled = false
added_style = 'bold green'
format = '[+$added]($added_style)/[-$deleted]($deleted_style) '

[sudo]
disabled = false
style = "bold yellow"
format = "as [sudo]($style) "

[git_status]
ahead = "${count}"
behind = "${count}"
deleted = "x"
diverged = "${ahead_count}${behind_count}"
style = "text"

[git_branch]
symbol = " "
style = "bold green"

[nix_shell]
format = 'via [$symbol(($name))]($style) '
symbol = " "

[cmd_duration]
disabled = false
style = "bold flamingo"
format = "took [$duration]($style)"
show_milliseconds = true
show_notifications = true
min_time_to_notify = 30_000

## SECOND LINE/ROW: Prompt
[battery]
charging_symbol = "󰂄 "
disabled = true
discharging_symbol = "󰁹 "
full_symbol = "󰂅 "

[[battery.display]]
disabled = false
style = "bold red"
threshold = 15

[[battery.display]]
disabled = true
style = "bold peach"
threshold = 50

[[battery.display]]
disabled = true
style = "bold green"
threshold = 90

[status]
disabled = false
format = '[\[$symbol$status_common_meaning$status_signal_name$status_maybe_int\]]($style)'
map_symbol = true
pipestatus = true
symbol = "✖"
not_executable_symbol = ""
not_found_symbol = ""
sigint_symbol = "󰟾"
signal_symbol = ""

[os]
disabled = false
format = ' [$symbol]($style)'
style = "bold mauve"

[character]
error_symbol = ""
success_symbol = "❯(bold green)"

