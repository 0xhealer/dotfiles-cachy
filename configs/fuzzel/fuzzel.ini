# fuzzel.ini
# Colors come from Noctalia's own Fuzzel Community Template now - confirmed
# output path from Noctalia's official community-templates repo
# (noctalia-dev/community-templates/fuzzel/template.toml):
#   output_path = "$XDG_CONFIG_HOME/fuzzel/themes/noctalia"
# Enable "Fuzzel" under Noctalia Settings -> Templates -> Community for
# this to actually get generated; until then, the include below is a
# silent no-op (fuzzel doesn't error on a missing include).

[main]
font=monospace:size=12
terminal=kitty
prompt="> "
lines=10
width=40

include=~/.config/fuzzel/themes/noctalia

[border]
width=2
radius=10
