# kitty.conf
# Transparency set here since kitty owns its own opacity. Actual BLUR is a
# compositor-level effect (Niri's own blur window-rule on transparent
# surfaces) - not configured here per instruction not to touch
# niri/noctalia config. Add a blur rule in your own Niri config targeting
# kitty's window class if you want blur behind this transparency.

background_opacity 0.85
dynamic_background_opacity yes

include current-theme.conf

font_family      monospace
font_size        12.0

allow_remote_control socket-only
listen_on unix:@mykitty
