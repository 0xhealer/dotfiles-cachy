# kitty.conf
# Transparency set here since kitty owns its own opacity. Actual BLUR is a
# compositor-level effect (a Niri blur window-rule) - not configured here
# per instruction not to touch niri/noctalia config.
#
# Wallpaper-driven colors come from Noctalia's own built-in theming now
# (confirmed 2026: Noctalia has a native Templates system with a Kitty
# Built-In Template, writing to this exact path), NOT matugen - that
# custom pipeline was removed. Enable "Kitty" under Noctalia's own
# Settings -> Templates -> Built-In for this file to actually get
# generated; until then, this include is a silent no-op.

background_opacity 0.85
dynamic_background_opacity yes

include themes/noctalia.conf

font_family      monospace
font_size        12.0

allow_remote_control socket-only
listen_on unix:@mykitty
